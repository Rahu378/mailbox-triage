[project]
name = "mailbox-triage"
version = "0.5.0"
description = "Middle-office shared mailbox triage: LLM classification and extraction, T+1 Jira tickets, SSI call-back controls"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0", "requests>=2.32"]

[project.optional-dependencies]
openai = ["openai>=1.50"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["triage"]

[tool.ruff]
line-length = 120
